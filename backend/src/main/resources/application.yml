spring:
  application:
    name: freeresumecreator
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:~/.freeresumecreator/resumemaker;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080

logging:
  level:
    com.resumemaker: INFO
    org.hibernate.SQL: WARN

app:
  seed-data:
    enabled: true
    files:
      - data/josephdata.sql
      - data/sweetydata.sql


